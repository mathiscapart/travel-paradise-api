services:
  database:
    image: mariadb:10.7.8
    container_name: travel-paradise-db
    env_file:
      - .env
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  pma:
    image: phpmyadmin
    ports:
      - "8080:80"
    environment:
      - PMA_ARBITRARY=1

volumes:
  db_data:
